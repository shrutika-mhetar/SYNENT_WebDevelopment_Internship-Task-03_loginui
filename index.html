<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Nova Login UI</title>

<link
rel="stylesheet"
href="style.css">

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="card">

<div class="logo">

✨ Nova

</div>

<h1>

Welcome Back

</h1>

<p>

Sign in to continue

</p>

<form>

<div class="input-group">

<input
type="email"

placeholder="Email Address"

required>

</div>

<div class="input-group password">

<input

id="password"

type="password"

placeholder="Password"

required>

<button

type="button"

onclick="togglePassword()">

👁

</button>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember me

</label>

<a href="#">

Forgot Password?

</a>

</div>

<button class="login-btn">

Login

</button>

</form>

<div class="divider">

OR

</div>

<div class="social">

<button>

Continue with Google

</button>

<button>

Continue with LinkedIn

</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
